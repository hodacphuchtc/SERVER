# Chặn biến bí mật server lọt vào bundle trình duyệt.
# Next.js nhúng GIÁ TRỊ của process.env.* được tham chiếu trong file "use client" vào JS
# gửi xuống browser. Với hệ giám sát, lộ SUPABASE_SERVICE_ROLE_KEY (bỏ qua RLS) hay
# DATABASE_URL là lộ toàn bộ dữ liệu máy chủ đang theo dõi.
# Danh sách biến dưới đây khớp .env.example — thêm biến bí mật mới thì thêm vào regex.
# Chạy: semgrep --config .semgrep/  (cài: brew install semgrep)

rules:
  - id: cam-bien-bi-mat-trong-use-client
    languages: [typescript]
    severity: ERROR
    message: >
      Biến bí mật server trong file "use client" — Next sẽ nhúng GIÁ TRỊ vào bundle gửi
      xuống trình duyệt. Chuyển logic vào server action / route handler.
    paths:
      include: ["**/app/**", "**/src/**", "**/components/**", "**/lib/**"]
    patterns:
      - pattern: process.env.$KEY
      - metavariable-regex:
          metavariable: $KEY
          regex: "^(SUPABASE_SERVICE_ROLE.*|DATABASE_URL|R2_SECRET_ACCESS_KEY|R2_ACCESS_KEY_ID|CRON_SECRET|VERCEL_TOKEN)$"
      - pattern-inside: |
          "use client";
          ...
